<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
</head>
<body>
    <form id="search-form">
        <input type="text" id="search-input" placeholder="Enter city name..." required>
        <button type="submit">Search</button>
    </form>

    <button id="unit-toggle" data-unit="F">C/F</button>

    <section id="weather-card">
        <h2 id="display-city"></h2>
        <p id="display-temp"></p>
        <p id="display-feels"></p>
        <p id="display-condition"></p>
        <p id="display-humidity"></p>
    </section>
</body>
</html>
